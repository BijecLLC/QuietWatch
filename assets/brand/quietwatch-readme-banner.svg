<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">QuietWatch README banner</title>
  <desc id="desc">QuietWatch banner with a simple QW monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08111d"/>
      <stop offset="1" stop-color="#102235"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect x="132" y="106" width="308" height="308" rx="68" fill="#0b1220"/>
  <rect x="155" y="129" width="262" height="262" rx="52" fill="none" stroke="#1f3347" stroke-width="4"/>
  <text x="183" y="299" fill="#f8fafc" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="0">Q</text>
  <text x="278" y="299" fill="#67e8f9" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="0">W</text>
  <text x="526" y="240" fill="#f8fafc" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="128" font-weight="800" letter-spacing="0">Quiet<tspan fill="#67e8f9">Watch</tspan></text>
  <text x="533" y="312" fill="#cbd5e1" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="500" letter-spacing="0">Level movie and TV audio without riding the volume knob.</text>
</svg>
